# Autostart applications and services

# System state
exec_always --no-startup-id numlockx on
exec --no-startup-id xset s off -dpms s noblank

# GTK theme live updates (must exist before apps launch)
exec_always --no-startup-id pkill -x gsd-xsettings; /usr/libexec/gsd-xsettings

exec_always --no-startup-id $HOME/.config/polybar/launch.sh

# Monitor setup
exec --no-startup-id xrandr --output DP-1 --primary

# Input / authentication
exec --no-startup-id $HOME/.config/i3/scripts/touchpad.sh
exec --no-startup-id /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1

# Tiling helper
exec_always --no-startup-id i3-auto-tiling

# Compositor
exec --no-startup-id compton

# Notifications / clipboard
exec --no-startup-id dunst
exec --no-startup-id diodon

# Desktop autostart applications
exec --no-startup-id dex --autostart --environment i3

# Network tray
exec --no-startup-id nm-applet

# Background
exec --no-startup-id hsetroot -solid "#56526e"

