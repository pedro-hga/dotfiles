# Brightness (DDC/CI monitor)
bindsym $mod+shift+period exec --no-startup-id ddc-brightness set 10%+ && polybar-msg hook lightness 1
bindsym $mod+shift+comma exec --no-startup-id ddc-brightness set 10%- && polybar-msg hook lightness 1

# Volume
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +5% && polybar-msg hook volume 1
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -5% && polybar-msg hook volume 1
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && polybar-msg hook volume 1

# Volume with mouse wheel
bindsym --whole-window Mod4+button4 exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +5% && polybar-msg hook volume 1
bindsym --whole-window Mod4+button5 exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -5% && polybar-msg hook volume 1

# Media controls
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext exec --no-startup-id playerctl next
bindsym XF86AudioPrev exec --no-startup-id playerctl previous

# Laptop brightness keys
bindsym XF86MonBrightnessUp exec --no-startup-id brightnessctl set +5% && polybar-msg hook lightness 1
bindsym XF86MonBrightnessDown exec --no-startup-id brightnessctl set 5%- && polybar-msg hook lightness 1
