# Rosé Pine Moon Colors
set -g @rp_base          '#232136'
set -g @rp_surface       '#2a273f'
set -g @rp_overlay       '#393552'
set -g @rp_muted         '#6e6a86'
set -g @rp_subtle        '#908caa'
set -g @rp_text          '#e0def4'

# Accents
set -g @rp_love          '#eb6f92'
set -g @rp_gold          '#f6c177'
set -g @rp_rose          '#ea9a97'
set -g @rp_pine          '#3e8fb0'
set -g @rp_foam          '#9ccfd8'
set -g @rp_iris          '#c4a7e7'

# Highlight levels (replaces catppuccin surface/overlay tiers)
set -g @rp_hl_low        '#2a283e'
set -g @rp_hl_med        '#44415a'
set -g @rp_hl_high       '#56526e'

# Status Bar
set-option -g status "on"
set -g status-interval 2
set-option -g status-style fg='#{@rp_text}',bg='#{@rp_base}',default

# Mode
set-option -g mode-style fg='#{@rp_iris}',bg='#{@rp_overlay}'

# Window
set-window-option -g window-status-style fg='#{@rp_muted}',bg='#{@rp_base}'
set-window-option -g window-status-activity-style 'bg=#{@rp_surface},fg=#{@rp_subtle}'
set-window-option -g window-status-current-style fg='#{@rp_base}',bg='#{@rp_foam}'

# Messages
set-option -g message-style fg='#{@rp_love}',bg='#{@rp_base}'
set-option -g message-command-style 'fg=#{@rp_subtle},bg=#{@rp_surface}'

# Pane
set-option -g pane-border-style fg='#{@rp_hl_med}'
set-option -g pane-active-border-style 'fg=#{@rp_pine}'
set-option -g display-panes-active-colour '#3e8fb0'
set-option -g display-panes-colour '#f6c177'

# Clock & Bell
set-window-option -g clock-mode-colour '#3e8fb0'
set-window-option -g window-status-bell-style fg='#{@rp_base}',bg='#{@rp_love}'

# Left Status
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@rp_base},bg=#{@rp_foam},bold] #S '

# Right Status
set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@rp_overlay}]#[fg=#{@rp_text},bg=#{@rp_overlay}] #(echo #{pane_current_path} | sed "s|^$HOME|~|") #[fg=#{@rp_foam},bg=#{@rp_overlay},bold]#[fg=#{@rp_base},bg=#{@rp_foam},bold] #h '

# Window Formatting
# set -g window-status-separator '#[fg=#{@rp_muted},bg=#{@rp_base}] '
set -g window-status-format "#[fg=#{@rp_muted},bg=#{@rp_base}] #I #[fg=#{@rp_muted},bg=#{@rp_base}]#W"
set -g window-status-current-format "#[fg=#{@rp_base},bg=#{@rp_foam}] #I #[fg=#{@rp_base},bg=#{@rp_foam},bold]#W #[fg=#{@rp_foam},bg=#{@rp_base},nobold]"
